<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftBill Pro | Modern Retail POS & Store Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 min-h-screen overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        function ping() {
          try {
            var x = new XMLHttpRequest();
            x.open("GET", "/__heartbeat?t=" + Date.now(), true);
            x.send();
          } catch(e) {}
        }
        ping();
        try {
          var blob = new Blob(["setInterval(function(){ postMessage(1); }, 1500);"], { type: "application/javascript" });
          var worker = new Worker(URL.createObjectURL(blob));
          worker.onmessage = function() { ping(); };
        } catch(e) {
          setInterval(ping, 1500);
        }
      })();
    </script>
  </body>
</html>
